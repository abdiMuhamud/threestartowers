name: Android APK

# Builds the mobile app into an installable APK.
#   - Push a tag like v1.0.1  -> builds ThreeStarTowers-1.0.1.apk (plus an -older-phones.apk for
#     32-bit devices) and publishes them as a GitHub Release.
#   - Run manually (Actions tab) -> builds a test APK, downloadable from the run's Artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # The tag is the source of truth for the version; the run number gives every
      # build a higher versionCode so a newer APK always installs over an older one.
      - name: Set app version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            LABEL="$VERSION"
          else
            VERSION="$(node -p "require('./app.json').expo.version")"
            LABEL="$VERSION-test.$GITHUB_RUN_NUMBER"
          fi
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = '$VERSION';
            app.expo.android.versionCode = $GITHUB_RUN_NUMBER;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      # One APK per processor type instead of a single universal file: the universal
      # APK carried four copies of the native code and came out over 100 MB.
      - name: Split APK by processor type
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include "arm64-v8a", "armeabi-v7a"
                      universalApk false
                  }
              }
          }
          EOF

      - name: Build APKs
        working-directory: mobile/android
        run: >
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          -Pexpo.useLegacyPackaging=true

      # arm64 is the main download (phones from roughly 2018 on); the 32-bit build
      # covers older and entry-level phones.
      - name: Name the APKs
        id: apk
        run: |
          OUT=android/app/build/outputs/apk/release
          ls -lh "$OUT"
          MAIN="ThreeStarTowers-${{ steps.version.outputs.label }}.apk"
          OLD="ThreeStarTowers-${{ steps.version.outputs.label }}-older-phones.apk"
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$OUT"/*arm64-v8a*.apk "$RUNNER_TEMP/apk/$MAIN"
          cp "$OUT"/*armeabi-v7a*.apk "$RUNNER_TEMP/apk/$OLD"
          ls -lh "$RUNNER_TEMP/apk"
          echo "dir=$RUNNER_TEMP/apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ThreeStarTowers-${{ steps.version.outputs.label }}
          path: ${{ steps.apk.outputs.dir }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # Safe to re-run: reuses a release left behind by a failed attempt and retries uploads.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "Three Star Towers $GITHUB_REF_NAME" --generate-notes
          for attempt in 1 2 3 4; do
            gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.dir }}"/*.apk --clobber && break
            [[ $attempt == 4 ]] && exit 1
            sleep 20
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
